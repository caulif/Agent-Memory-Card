    reason: 当前环境事实，不应变成设计规则

  - id: one-off-install-dep
    description: 一次性安装依赖
    user_messages:
      - "现在先安装 lucide-react 这个依赖"
    reason: 单次操作请求，不应沉淀

  - id: one-off-file-path
    description: 当前任务临时文件路径
    user_messages:
      - "这轮只检查 app/src/main.tsx 这个文件"
    reason: 当前任务边界，不是长期偏好

