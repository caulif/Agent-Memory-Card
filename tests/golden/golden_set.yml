    user_messages:
      - "页面级组件继续按 review artifact memory eval assignment 拆清楚"
      - "Drafts 和 MemoryCards 不要继续堆业务逻辑，拆到 feature 组件和 read model"
      - "再次强调按 review、artifact、memory、eval、assignment 分边界"
    expected_title_keywords: ["边界", "组件"]
    expected_kind: procedure
    expected_scope: project

  - id: real-daofocus-project-workflow-recall
    description: DaoFocus 项目工作流不能被低层产品细节或泛泛方法论挤掉
    user_messages:
      - "DaoFocus 项目约定：开发任务要先 TDD，再用 Bun 跑测试，完成后 review，merge 前做验证"
      - "再次强调 DaoFocus 项目约定：TDD、Bun 测试、review、merge 前验证是长期工作流"
      - "以后 DaoFocus 项目工作流都按 TDD、Bun 测试、review、merge 前验证执行"
