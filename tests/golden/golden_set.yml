    expected_title_keywords: ["证据", "信心"]
    expected_kind: procedure
    expected_scope: global

  - id: hand-written-provider-evidence-grounded
    description: provider 生成的 evidence quote 必须能回到 observation
    user_messages:
      - "provider 生成的 evidence quote 必须能回到原始 observation"
      - "不要接受 LLM 编造的 evidence，quote 要能在 observation 里找到"
      - "再次强调 provider-induced evidence 必须可回溯"
    expected_title_keywords: ["evidence", "observation"]
    expected_kind: constraint
    expected_scope: global

  - id: hand-written-no-proxy-completion
    description: 不把测试通过当作目标完成的代理信号
    user_messages:
      - "不要把测试通过当成目标完成，必须对照需求做完成审计"
      - "绿色测试只是证据之一，不能替代 prompt-to-artifact audit"
      - "再次强调完成要看每条需求有没有真实 artifact 证据"
    expected_title_keywords: ["完成", "审计"]
    expected_kind: procedure
    expected_scope: global

  - id: hand-written-file-scoped-drift-resolution
    description: drift 应支持逐文件处理，避免全局覆盖
    user_messages:
      - "drift 恢复应该支持逐文件处理，不要只能全局丢弃"
      - "多个生成文件 drift 时，要能按目标文件分别导入、保留或丢弃"
      - "再次强调 file-scoped drift resolution，避免一次覆盖所有手改"
    expected_title_keywords: ["drift", "逐文件"]
    expected_kind: procedure
    expected_scope: project

  - id: hand-written-memory-merge-review
    description: 合并 Memory Card 前要展示来源差异和影响范围
    user_messages:
      - "Memory Card 合并前要展示源卡差异、保留字段和影响哪些 Agent"
      - "生成合并草稿还不够，merge review 要能看 lineage 和最终预览"
      - "再次强调合并卡片要先审查来源链路和目标 Agent 影响"
    expected_title_keywords: ["合并", "lineage"]
    expected_kind: procedure
    expected_scope: project

  - id: hand-written-feature-boundaries
