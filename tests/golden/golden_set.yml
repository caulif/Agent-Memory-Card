      - "再次强调用户批准、拒绝、编辑候选以后，要把审查反馈回流成 Golden Set 或 eval corpus"
      - "以后用户批准、拒绝、编辑候选以后，都要把审查反馈回流成 Golden Set 或 eval corpus"
    expected_title_keywords: ["反馈", "Golden"]
    expected_kind: procedure
