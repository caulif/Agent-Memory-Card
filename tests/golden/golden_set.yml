  - id: real-extraction-profile-lane-weights
    description: 项目级 ExtractionProfile 应记录 lane 权重和领域词
    user_messages:
      - "每个项目要有 ExtractionProfile，记录高价值 lane、低价值 lane、领域词和证据策略"
      - "再次强调每个项目要有 ExtractionProfile，记录高价值 lane、低价值 lane、领域词和证据策略"
      - "以后每个项目要有 ExtractionProfile，记录高价值 lane、低价值 lane、领域词和证据策略"
    expected_title_keywords: ["ExtractionProfile", "lane"]
    expected_kind: procedure
    expected_scope: project

  - id: real-run-qa-before-review
