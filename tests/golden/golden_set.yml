    user_messages:
      - "每次提炼运行都要有 RunQAReport，检查 evidence validity、duplicate signatures、scope risk 和 provider failures"
      - "再次强调每次提炼运行都要有 RunQAReport，检查 evidence validity、duplicate signatures、scope risk 和 provider failures"
      - "以后每次提炼运行都要有 RunQAReport，检查 evidence validity、duplicate signatures、scope risk 和 provider failures"
    expected_title_keywords: ["RunQA", "评分"]
    expected_kind: procedure
    expected_scope: project

  - id: real-seen-memory-signatures
    description: 已见过的 evidence/body/outcome 要记录 signature 防重复
    user_messages:
      - "需要 seen-memory-signatures 记录已经见过的 evidence、body 和用户处理结果，用来防重复"
      - "再次强调需要 seen-memory-signatures 记录已经见过的 evidence、body 和用户处理结果，用来防重复"
      - "以后需要 seen-memory-signatures 记录已经见过的 evidence、body 和用户处理结果，用来防重复"
    expected_title_keywords: ["signature", "去重"]
    expected_kind: procedure
    expected_scope: project

negatives:
  - id: one-off-css
    description: 一次性 CSS 修改请求
    user_messages:
      - "这次只把首页按钮颜色改成红色"
    reason: 一次性任务，单 session 单消息，无 recurrence

  - id: greeting
    description: 模型问候
    user_messages:
      - "你好"
      - "你是哪个模型"
    reason: 无信息问候，应在 STRIP 层被干掉

  - id: tool-echo
    description: 工具回显残余
    user_messages:
      - "<tool_use>edit_file path=foo.rs</tool_use>"
    reason: STRIP 层应该剥掉 XML 标签

  - id: partial-sentence
    description: 半截句
    user_messages:
      - "那个文件里的"
      - "或者这样吧"
    reason: 信息密度不足以归纳出规则

  - id: model-self-intro
    description: Agent 自我介绍
    user_messages:
      - "我是 Claude，由 Anthropic 训练的 AI"
    reason: 不是用户表达，是 assistant 自述

  - id: prompt-template-leak
    description: LLM prompt 模板被错误录入 observation
    user_messages:
      - "你是 Agent 长期记忆的最终质检与改写器。请只返回 JSON"
    reason: looks_like_system_prompt 应该拦截

  - id: time-bound-one-off
    description: 一次性 ad-hoc 决定
    user_messages:
      - "今天临时跳过 lint 检查赶时间"
    reason: 显式一次性，不该固化为长期规则

  - id: temporary-file-scope-boundary
    description: 当前任务里的临时文件边界不是长期规则
    user_messages:
      - "这个 PR 里先不要动 src/build.rs"
      - "这次任务先别改 build.rs，只看 app 页面"
      - "当前这轮不要碰 build 模块，避免扩大范围"
    reason: 当前任务/PR 的临时写作边界，不应沉淀为长期偏好

  - id: one-off-port-change
    description: 一次性端口切换
    user_messages:
      - "这次 dev server 临时换到 5174"
    reason: 单次运行环境选择，不是长期偏好

  - id: one-off-screenshot-request
    description: 一次性截图请求
    user_messages:
      - "帮我截一下当前页面看看"
    reason: 当前操作请求，不应沉淀为长期规则

  - id: transient-network-failure
    description: 临时网络失败描述
    user_messages:
      - "刚才网络抽风导致 npm install 失败"
    reason: 环境偶发故障，不是用户长期偏好

  - id: current-branch-status
    description: 当前分支状态汇报
    user_messages:
      - "现在这个分支还有三个未提交文件"
    reason: 当前状态事实，不是可复用规则

  - id: one-off-copy-request
    description: 一次性复制文本请求
    user_messages:
      - "把这段错误信息复制到 issue 里"
    reason: 单次操作，不具备 durable value

  - id: temporary-debug-logging
    description: 临时调试日志
    user_messages:
      - "先加几个 console.log 看看这个状态"
      - "这轮临时多打日志，调完删掉"
    reason: 明确临时调试，不应升级为长期做法

  - id: one-off-dependency-version
    description: 当前任务临时指定依赖版本
    user_messages:
      - "这次先固定 vite 到 8.0.10"
    reason: 单次依赖决策，缺少 recurrence

  - id: assistant-progress-echo
    description: 助手进度回显不应成为记忆
    user_messages:
      - "我已经开始检查文件并准备修改"
    reason: 这是助手式进度文本，不是用户偏好

  - id: temporary-visual-tweak
    description: 一次性视觉微调
    user_messages:
      - "这次先把卡片间距缩小一点"
    reason: 当前页面微调，不是长期设计原则

  - id: one-off-run-command
    description: 一次性运行命令
    user_messages:
      - "现在跑一下 cargo test --lib"
    reason: 单次命令请求，不应沉淀

  - id: provider-timeout-failure
    description: provider 临时超时失败
    user_messages:
      - "刚才 provider 调用超时了，先重试一次"
    reason: 临时运行失败，不是长期偏好

  - id: malformed-provider-json
    description: provider 当前返回 malformed JSON
    user_messages:
      - "这次 provider 返回了 malformed JSON，先记录错误"
    reason: 当前执行故障，不是可复用规则

  - id: current-golden-score
    description: 当前 Golden Set 分数事实
    user_messages:
      - "现在 Golden Set evidence validity 是 83%"
    reason: 当前指标事实，不应沉淀为长期规则

  - id: one-off-open-tab
    description: 一次性打开页面
    user_messages:
      - "打开 Memory Cards 页面看一下"
    reason: 单次导航请求，不是长期偏好

  - id: typo-fix-once
    description: 一次性修 typo
    user_messages:
      - "这次只把 README 里的拼写错误修一下"
    reason: 单次编辑任务，不是长期规则

  - id: temporary-branch-name
    description: 当前临时分支名
    user_messages:
      - "这个临时分支就叫 codex/drift-ui"
    reason: 当前分支命名事实，不是持久规则

  - id: current-browser-width
    description: 当前浏览器宽度事实
    user_messages:
