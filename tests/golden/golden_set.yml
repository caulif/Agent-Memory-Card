# 黄金集：流水线提炼质量回归基线
#
# 设计原则
#
# - positives：用户在多个 session 里反复用不同措辞表达的同一长期偏好；
#   流水线应该聚类 + 归纳 + 结晶出至少一张卡，title/body 包含期望关键词。
# - negatives：一次性请求、模型问候、内部 ID、半截句、明显边界声明；
#   流水线**不应**对这些产出卡。
#
# 来源
#
# 4 张 positives（id 以 archived 开头）来自 .agent-kernel/memory-cards/.archive/
# 已经人工审过的 cards——它们是 ground truth。其余 positives + negatives
# 是基于本项目真实历史话题手写的最小可用补充。
#
# 测试参考 tests/golden_set_regression.rs。
version: 1

positives:
  - id: archived-real-history-regression
    description: 用真实历史会话回归验证提炼，不要只依赖静态样例
    user_messages:
      - "评估提炼质量时优先用真实历史会话做回归验证"
      - "改提炼逻辑前必须用真实历史跑一遍，别只用静态样例"
      - "再次强调用真实历史会话做回归检验"
      - "提炼相关的改动要在真实历史上验证才能合"
    expected_title_keywords: ["真实历史", "回归"]
    expected_kind: procedure
    expected_scope: global

  - id: archived-keep-human-review-boundary
    description: 保留人工审阅边界，不让 AI 直接固化规则
    user_messages:
      - "先 review 再 merge，保留人工审阅边界"
      - "不要让 AI 直接固化规则，必须经过人工审阅"
      - "review 边界不能省，AI 自动写入规则我不接受"
    expected_title_keywords: ["人工", "审阅"]
    expected_kind: procedure
    expected_scope: global

  - id: archived-user-perspective-quality
    description: 从用户视角判断体验质量
    user_messages:
      - "判断体验好不好要从用户视角，不是开发者视角"
      - "评估质量必须站在用户角度，开发者自己觉得对没用"
      - "再次强调从用户视角看体验"
    expected_title_keywords: ["用户视角"]
    expected_kind: preference
    expected_scope: global

  - id: archived-test-scope-by-risk
    description: 按改动风险选择测试范围
    user_messages:
      - "测试范围按改动风险选，不要每次都跑全量"
      - "改动风险低就跑相关单测，风险高才跑集成"
      - "再次强调按风险定测试边界"
    expected_title_keywords: ["改动风险", "测试"]
    expected_kind: procedure
    expected_scope: global

  - id: hand-written-no-emoji
    description: 输出禁用 emoji
    user_messages:
      - "回复一律不要 emoji，简体中文"
      - "禁止表情符号，所有输出纯文本"
      - "再次强调不要 emoji"
    expected_title_keywords: ["emoji", "表情"]
    expected_kind: preference
    expected_scope: global

  - id: hand-written-no-auto-commit
