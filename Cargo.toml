[package]
name = "agent-kernel"
version = "0.1.0"
edition = "2024"
description = "Project-centered Agent skills and rules workspace"
license = "MIT"

[[bin]]
name = "agent-kernel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
eframe = "0.34.1"
open = "5.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.23"
