[package]
name = "agent-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Project-centered Agent skills and rules workspace"
license = "MIT"

[[bin]]
name = "agent-kernel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.23"
fastembed = { version = "5.13.2", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
walkdir = "2.5"

[dev-dependencies]
