name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun install --cwd app --frozen-lockfile
      - run: cargo build --release
      - name: Stage Windows CLI binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/win32-x64 | Out-Null
          Copy-Item target/release/agent-kernel.exe dist/win32-x64/agent-kernel.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agent-kernel-win32-x64
          path: dist/win32-x64

  bun-pack-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Assemble Windows package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item -Recurse downloaded/agent-kernel-win32-x64 bin/win32-x64
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun pm pack
      - uses: actions/upload-artifact@v4
        with:
          name: agent-kernel-bun-package-windows
          path: agent-kernel-*.tgz

  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun install --cwd app --frozen-lockfile
      - run: bun run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: agent-kernel-windows-desktop
          path: src-tauri/target/release/bundle/**
